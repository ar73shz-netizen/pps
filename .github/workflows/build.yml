name: Build APK
on:
  push:
    branches: [main, master]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - run: npm install
      - name: Fixed debug signing key (keeps app updatable without data loss)
        run: |
          mkdir -p ~/.android
          cp android-debug.keystore ~/.android/debug.keystore
      - run: npx cap add android
      - name: Bundle fonts (works offline)
        run: |
          mkdir -p www/fonts
          F=$(find node_modules/vazirmatn -name '*wght*.woff2' | head -1)
          if [ -z "$F" ]; then F=$(find node_modules/vazirmatn -name 'Vazirmatn-Regular.woff2' | head -1); fi
          [ -n "$F" ] && cp "$F" www/fonts/Vazirmatn.woff2 || true
          L=$(find node_modules/@fontsource/lalezar -name '*arabic-400-normal.woff2' | head -1)
          [ -n "$L" ] && cp "$L" www/fonts/Lalezar.woff2 || true
      - name: App icon, alarm sound, widget, permissions
        run: |
          pip install pillow
          python3 tools/make_icons.py
          mkdir -p android/app/src/main/res/raw
          cp resources/alarm.wav android/app/src/main/res/raw/alarm.wav
          bash tools/setup_native.sh
      - run: npx cap sync android
      - run: cd android && chmod +x gradlew && ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: personal-manager-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
